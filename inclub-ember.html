<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>IN-CLUB EMBER — 설계 시연 목업</title>
<style>
  /* 제품 코드가 아니다 — docs/인클럽_EMBER_설계.md 의 시각 사양을 만질 수 있게 한 목업 */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0b0b10; font-family:-apple-system,'Segoe UI',sans-serif; color:#fafafa;
    touch-action:manipulation; user-select:none; -webkit-user-select:none; overflow:hidden; }
  .stage { height:100%; display:grid; place-items:center; }
  .phone { position:relative; width:min(390px,100vw); height:min(844px,100vh); background:#08070c; overflow:hidden; }

  /* ── 상태줄 (표시 전용 + 쉴드) ── */
  .status { position:absolute; top:0; left:0; right:0; height:50px; display:flex; align-items:center;
    padding:0 16px; gap:6px; z-index:30; }
  .ember { width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffd9a0, #ff7a1a 60%, #b34700);
    box-shadow:0 0 8px rgba(255,122,26,.8); transition:all .5s; }
  .ember.ash { background:#3a3a3a; box-shadow:none; }
  .flare-dot { width:11px; height:11px; margin-left:6px; background:linear-gradient(135deg,#ffe9a8,#f5b60d);
    transform:rotate(45deg); box-shadow:0 0 9px rgba(245,182,13,.75); transition:all .5s; }
  .flare-dot.ash { background:#3a3a3a; box-shadow:none; }
  .shield { margin-left:auto; width:34px; height:34px; display:grid; place-items:center; color:#9aa4b5; }
  .shield svg { filter:drop-shadow(0 1px 2px rgba(0,0,0,.7)); }

  /* ── 카드 덱 ── */
  .deck { position:absolute; top:50px; bottom:150px; left:0; right:0; display:grid; place-items:center; }
  .card { position:absolute; width:86%; height:96%; border-radius:24px; overflow:hidden;
    background:#101018; transition:transform .26s cubic-bezier(.2,.9,.3,1), opacity .3s; }
  .card .art { position:absolute; inset:0; filter:contrast(.95) brightness(.9); }
  .card .grain { position:absolute; inset:0; opacity:.4; mix-blend-mode:overlay;
    background-image:repeating-conic-gradient(rgba(255,255,255,.06) 0 .8deg, transparent .8deg 1.7deg); }
  .card .veil { position:absolute; left:0; right:0; bottom:0; height:34%;
    background:linear-gradient(180deg, transparent, rgba(5,4,8,.9)); }
  .card .meta { position:absolute; left:18px; right:18px; bottom:16px; display:flex; align-items:center; gap:10px;
    font-size:13px; letter-spacing:.06em; color:#e8e8f0; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  .chip { width:22px; height:22px; border-radius:50%; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5), 0 1px 4px rgba(0,0,0,.6); }
  .flare-badge { position:absolute; left:16px; bottom:56px; width:34px; height:34px; display:grid; place-items:center; }
  .flare-badge i { width:16px; height:16px; background:linear-gradient(135deg,#ffe9a8,#f5b60d); transform:rotate(45deg);
    box-shadow:0 0 10px rgba(245,182,13,.85); }
  .peek { position:absolute; right:16px; bottom:56px; font-size:10px; letter-spacing:.12em; color:#cfd6e2;
    background:rgba(10,10,16,.55); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:5px 10px; }

  /* 홀드 링 — 카드 테두리를 따라 차오르는 conic 게이지 */
  .ring { position:absolute; inset:0; border-radius:24px; padding:4px; pointer-events:none; opacity:0;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude; }
  .ring.on { opacity:1; }
  /* 받은 스파크 — 도화선 테두리 */
  .card.inbound { box-shadow:0 0 0 2.5px rgba(255,150,60,.9), 0 0 26px rgba(255,122,26,.5); }
  .card.inbound::after { content:'받은 스파크 — 꾹 누르면 수락'; position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.1em; color:#ffcf9e; background:rgba(20,10,4,.7); padding:5px 12px; border-radius:999px; }

  /* 노출 카드 펼침 */
  .expand { position:absolute; left:0; right:0; bottom:0; max-height:0; overflow:hidden; z-index:5;
    background:rgba(8,7,12,.94); transition:max-height .22s ease-out; border-top:1px solid rgba(255,255,255,.14); }
  .expand.open { max-height:46%; }
  .expand .row { padding:12px 18px; font-size:13px; border-bottom:1px solid rgba(255,255,255,.08); color:#dfe4ee; }
  .expand .row b { display:block; font-size:10px; letter-spacing:.18em; color:#8f97a8; margin-bottom:4px; }

  /* 가장자리 달아오름 / 섬광 */
  .edge { position:absolute; inset:0; pointer-events:none; opacity:0; z-index:40;
    box-shadow:inset 0 0 60px 12px rgba(255,122,26,.75); transition:opacity .6s; }
  .edge.gold { box-shadow:inset 0 0 70px 16px rgba(245,182,13,.8); }
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:60; }

  /* ── 매치 성사 ── */
  .match { position:absolute; inset:0; z-index:50; display:none; place-items:center; background:rgba(5,4,8,.96); text-align:center; }
  .match.on { display:grid; }
  .match .pair { display:flex; gap:14px; justify-content:center; margin-bottom:18px; }
  .match .pair .chip { width:44px; height:44px; animation:merge 1s ease-out; }
  @keyframes merge { from { transform:translateX(var(--from)) scale(.6); opacity:.2; } to { transform:none; opacity:1; } }
  .match h2 { font-size:30px; font-weight:800; letter-spacing:-.02em; margin-bottom:6px; }
  .match p { font-size:12.5px; color:#9aa2b3; margin-bottom:26px; }
  .match .btn { display:block; width:78%; margin:0 auto 10px; padding:15px 0; border-radius:999px; font-size:14px; font-weight:700;
    border:0; color:#0b0b10; background:linear-gradient(135deg,#ffd9a0,#ff8a2a); box-shadow:0 8px 26px rgba(255,122,26,.4); }
  .match .btn.ghost { background:transparent; color:#dfe4ee; box-shadow:inset 0 0 0 1.4px rgba(255,255,255,.4); }

  /* ── 하단 메뉴 — 렌즈 유리, 아이콘만 ── */
  .tabbar { position:absolute; left:0; right:0; bottom:0; height:76px; display:flex; z-index:30;
    background:rgba(10,9,14,.55); backdrop-filter:blur(1.8px) saturate(1.4); border-top:1px solid rgba(255,255,255,.12); }
  .tab { flex:1; display:grid; place-items:center; color:#8f97a8; position:relative; }
  .tab.active { color:#ffb14e; }
  .tab svg { filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .tab .badge { position:absolute; top:14px; right:calc(50% - 18px); width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd9a0, #ff7a1a); box-shadow:0 0 7px rgba(255,122,26,.9); display:none; }
  .tab .badge.on { display:block; }

  /* 데모 리모컨 (목업 전용 — 실제 앱에는 없음) */
  .remote { position:absolute; top:56px; left:50%; transform:translateX(-50%); z-index:70; display:flex; gap:8px; }
  .remote button { font-size:10px; letter-spacing:.08em; padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.25);
    background:rgba(12,12,18,.7); color:#aeb6c6; }
</style>
</head>
<body>
<div class="stage"><div class="phone" id="phone">

  <div class="status">
    <span class="ember" id="e0"></span><span class="ember" id="e1"></span><span class="ember" id="e2"></span>
    <span class="flare-dot" id="fd"></span>
    <span class="shield" title="쉴드 — 차단/안전">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6l7-3z"/>
      </svg>
    </span>
  </div>

  <div class="remote">
    <button id="rxBtn">데모: 스파크 받기</button>
    <button id="resetBtn">처음부터</button>
  </div>

  <div class="deck" id="deck"></div>

  <div class="edge" id="edge"></div>
  <div class="flash" id="flash"></div>

  <div class="match" id="match">
    <div>
      <div class="pair">
        <span class="chip" style="--from:-70px; background:#7b5cff"></span>
        <span class="chip" style="--from:70px;  background:#ff2e7e"></span>
      </div>
      <h2>SPARK!</h2>
      <p>연락처·실명은 오가지 않아요 · 쉴드 한 번이면 조용히 사라집니다</p>
      <button class="btn" onclick="alert('스태프 존 C — 조명이 있고 직원이 보이는 자리로 안내합니다 (목업)')">스태프 존에서 만나기</button>
      <button class="btn ghost" onclick="document.getElementById('match').classList.remove('on')">채팅</button>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active" title="스파크">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 5 14h5l-1 8 8-12h-5l1-8z"/></svg>
    </div>
    <div class="tab" title="채팅">
      <span class="badge" id="chatBadge"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H9l-5 4V6z"/></svg>
    </div>
    <div class="tab" title="마이">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8c0-2 2-4 8-4s8 2 8 4-1 7-3 9c-1.4 1.4-2 3-5 3s-3.6-1.6-5-3C5 15 4 10 4 8z"/><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="15" cy="10" r="1.3" fill="currentColor"/></svg>
    </div>
  </div>

</div></div>

<script>
/* 목업 데이터 — 익명 룩 카드. 사진 대신 그라디언트+그레인(저해상·그레인이 제품 기본이기도 하다) */
const CARDS = [
  { art:'radial-gradient(120% 90% at 20% 15%, #3b2a66 0%, #14101f 55%), radial-gradient(80% 60% at 85% 80%, #4b1d3f 0%, transparent 60%)',
    chips:['#7b5cff','#ff2e7e'], meta:'존 B · 23:40 · 12m',
    exposed:[['신체정보','181cm · 74kg · 어깨 넓은 편'],['마이소개','하우스 좋아해요 · 칵테일보다 하이볼']] },
  { art:'radial-gradient(110% 80% at 80% 10%, #0f4d3c 0%, #0c1210 60%), radial-gradient(70% 50% at 15% 85%, #b8891f 0%, transparent 55%)',
    chips:['#12d6a0','#ffbd59'], meta:'존 A · 00:05 · 8m', exposed:[] },
  { art:'radial-gradient(130% 90% at 50% 0%, #55201f 0%, #120c0e 60%), radial-gradient(60% 45% at 80% 75%, #23335f 0%, transparent 55%)',
    chips:['#ff5a3c','#2f63ff'], meta:'존 C · 23:58 · 21m',
    exposed:[['이미지','(사진 2장 — 탭해서 넘겨보기)']] },
];
const HOLD_MS = 1200;

let embers = 3, flare = 1, idx = 0, inbound = false;

const deck = document.getElementById('deck');
const edge = document.getElementById('edge');
const flash = document.getElementById('flash');

function ashDots() {
  for (let i = 0; i < 3; i++) document.getElementById('e' + i).classList.toggle('ash', i >= embers);
  document.getElementById('fd').classList.toggle('ash', flare < 1);
}

function makeCard(data, isInbound) {
  const el = document.createElement('div');
  el.className = 'card' + (isInbound ? ' inbound' : '');
  el.innerHTML = `
    <div class="art" style="background:${data.art}"></div>
    <div class="grain"></div>
    <div class="veil"></div>
    ${flare > 0 && !isInbound ? '<span class="flare-badge" title="플레어(하루 1발) — 꾹 누르기"><i></i></span>' : ''}
    ${data.exposed.length ? '<span class="peek">카드 ' + data.exposed.length + ' · 탭</span>' : ''}
    <div class="meta"><span class="chip" style="background:${data.chips[0]}"></span><span class="chip" style="background:${data.chips[1]}"></span><span>${data.meta}</span></div>
    <div class="ring" ></div>
    <div class="expand">${data.exposed.map(([k, v]) => `<div class="row"><b>${k}</b>${v}</div>`).join('')}</div>`;
  attachGestures(el, data, isInbound);
  return el;
}

function show(i) {
  deck.innerHTML = '';
  deck.appendChild(makeCard(CARDS[i % CARDS.length], false));
}

/* 제스처: 탭=펼침 / 드래그=다음 / 1.2초 홀드=보내기·수락 (설계 §3 타이밍 그대로) */
function attachGestures(card, data, isInbound) {
  const ring = card.querySelector('.ring');
  let t0 = 0, raf = 0, sx = 0, sy = 0, moved = 0, holdDone = false, goldHold = false;

  function paint(p, gold) {
    ring.classList.add('on');
    const c = gold ? '#f5b60d' : '#ff7a1a';
    ring.style.background = `conic-gradient(${c} ${p * 360}deg, rgba(255,255,255,.13) 0)`;
  }
  function loop() {
    const p = Math.min(1, (performance.now() - t0) / HOLD_MS);
    paint(p, goldHold);
    if (navigator.vibrate && [300, 550, 750, 900, 1050].some(m => Math.abs(p * HOLD_MS - m) < 16)) navigator.vibrate(12);
    if (p >= 1) { holdDone = true; fire(); return; }
    raf = requestAnimationFrame(loop);
  }
  function fire() {
    flash.style.transition = 'none'; flash.style.opacity = .85;
    if (navigator.vibrate) navigator.vibrate(80);
    setTimeout(() => { flash.style.transition = 'opacity .5s'; flash.style.opacity = 0; }, 80);
    if (goldHold) { flare = 0; edge.classList.add('gold'); glowEdge(); }
    if (isInbound) { celebrate(); }
    else {
      if (!goldHold) embers = Math.max(0, embers - 1);
      card.style.transform = 'translateY(-46px) scale(.92)'; card.style.opacity = 0;
      setTimeout(() => { inbound = false; show(++idx); }, 480);
    }
    ashDots();
  }
  card.addEventListener('pointerdown', (e) => {
    sx = e.clientX; sy = e.clientY; moved = 0; holdDone = false;
    goldHold = !!e.target.closest('.flare-badge');
    if (goldHold && flare < 1) { goldHold = false; }
    if (!isInbound && !goldHold && embers < 1) return; // 잔량 없음 — 홀드 자체가 시작 안 됨
    t0 = performance.now(); raf = requestAnimationFrame(loop);
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', (e) => {
    moved = Math.max(moved, Math.hypot(e.clientX - sx, e.clientY - sy));
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 14 && !holdDone) { // 드래그 시작 → 홀드 취소, 카드가 손을 따라감
      cancelAnimationFrame(raf); ring.classList.remove('on');
      card.style.transition = 'none'; card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
    }
  });
  card.addEventListener('pointerup', (e) => {
    cancelAnimationFrame(raf);
    if (holdDone) return;
    const dx = e.clientX - sx;
    ring.style.background = ''; setTimeout(() => ring.classList.remove('on'), 400); // 되감기
    card.style.transition = '';
    if (Math.abs(dx) > 90 && !isInbound) { // 스와이프 = 다음(비용 0, 신호 없음)
      card.style.transform = `translateX(${dx > 0 ? 480 : -480}px) rotate(${dx > 0 ? 14 : -14}deg)`; card.style.opacity = 0;
      setTimeout(() => show(++idx), 240);
    } else if (moved < 8) { // 탭 = 더 보기(비용 0)
      const ex = card.querySelector('.expand');
      if (ex.innerHTML.trim()) ex.classList.toggle('open');
      card.style.transform = '';
    } else card.style.transform = '';
  });
}

function glowEdge() { edge.style.opacity = 1; setTimeout(() => { edge.style.opacity = 0; edge.classList.remove('gold'); }, 700); }

/* 데모: 받은 스파크 — 가장자리 달아오름 + 덱 맨 앞에 도화선 카드 */
document.getElementById('rxBtn').onclick = () => {
  if (inbound) return;
  inbound = true;
  if (navigator.vibrate) navigator.vibrate([60, 90, 60]);
  glowEdge();
  const data = { art:'radial-gradient(120% 90% at 70% 20%, #5a2a10 0%, #170d08 60%), radial-gradient(70% 55% at 20% 80%, #7b1f4b 0%, transparent 55%)',
    chips:['#ff8a2a','#c64bff'], meta:'존 C · 방금 · 9m',
    exposed:[['마이소개','재즈바 갔다가 왔어요 · 진토닉']] };
  deck.innerHTML = '';
  deck.appendChild(makeCard(data, true));
};

function celebrate() {
  document.getElementById('match').classList.add('on');
  document.getElementById('chatBadge').classList.add('on');
  if (navigator.vibrate) navigator.vibrate([90, 60, 90, 60, 140]);
  inbound = false;
}

document.getElementById('resetBtn').onclick = () => { embers = 3; flare = 1; idx = 0; inbound = false;
  document.getElementById('match').classList.remove('on');
  document.getElementById('chatBadge').classList.remove('on');
  ashDots(); show(0); };

ashDots(); show(0);
</script>
</body>
</html>
